name: Lucid
options:
  bundleIdPrefix: com.lucid
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.lucid.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"

targets:
  Lucid:
    type: application
    platform: iOS
    sources:
      - path: Lucid
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Lucid/Info.plist
        PRODUCT_NAME: Lucid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Lucid/Info.plist
      properties:
        CFBundleDisplayName: Lucid
        CFBundleName: Lucid
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: public.mp3
            UTTypeDescription: MP3 Audio
            UTTypeConformsTo:
              - public.audio
            UTTypeTagSpecification:
              public.filename-extension:
                - mp3
              public.mime-type:
                - audio/mpeg
        CFBundleDocumentTypes:
          - CFBundleTypeName: MP3 Audio
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mp3
        NSAppleMusicUsageDescription: "Lucid needs access to play your music files."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}